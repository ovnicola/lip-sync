<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lip Sync Test</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; color: #fff; font-family: -apple-system, sans-serif; }
  #screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #counter {
    position: absolute; top: 20px; left: 20px;
    font: 600 18px ui-monospace, monospace;
    background: rgba(0,0,0,.65); padding: 8px 12px; border-radius: 10px;
  }
  #panel {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(20,20,20,.92); padding: 16px;
    display: grid; gap: 12px;
  }
  label { font-size: 14px; opacity: .85; }
  select, input[type=range], button { width: 100%; font-size: 16px; }
  button {
    padding: 14px; border: 0; border-radius: 12px;
    background: #0a84ff; color: white; font-weight: 600;
  }
  .hidden { display: none; }
</style>
</head>
<body>

<div id="screen">
  <canvas id="canvas"></canvas>
  <div id="counter">Frame 0</div>
</div>

<div id="panel">
  <label>Mire</label>
  <select id="pattern">
    <option value="flash">Flash blanc</option>
    <option value="bars">Barres de couleurs</option>
    <option value="checker">Damier</option>
    <option value="countdown">Compte à rebours</option>
  </select>

  <label>Audio</label>
  <select id="audio">
    <option value="click">Clic court</option>
    <option value="beep">Bip 1 kHz</option>
    <option value="none">Aucun</option>
  </select>

  <label>Durée du flash : <span id="flashValue">2</span> frames</label>
  <input id="flash" type="range" min="1" max="10" step="1" value="2">

  <label>Période : <span id="periodValue">2.0</span> s</label>
  <input id="period" type="range" min="0.5" max="10" step="0.5" value="2">

  <label>Décalage audio : <span id="delayValue">0</span> ms</label>
  <input id="delay" type="range" min="-200" max="200" step="1" value="0">

  <label>Niveau audio : <span id="levelValue">80</span> %</label>
  <input id="level" type="range" min="0" max="100" step="1" value="80">

  <button id="start">Démarrer le test</button>
  <button id="stop" class="hidden">Arrêter</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const counter = document.getElementById('counter');
const panel = document.getElementById('panel');
const startButton = document.getElementById('start');
const stopButton = document.getElementById('stop');

let running = false;
let frame = 0;
let flashFramesLeft = 0;
let framesUntilFlash = 0;
let audioContext;
let nextEventTime = 0;

function resize() {
  canvas.width = innerWidth * devicePixelRatio;
  canvas.height = innerHeight * devicePixelRatio;
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
}

addEventListener('resize', resize);
resize();

function draw() {
  const w = canvas.width;
  const h = canvas.height;
  const pattern = document.getElementById('pattern').value;
  const flashActive = flashFramesLeft > 0;

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);

  if (pattern === 'flash') {
    ctx.fillStyle = flashActive ? '#fff' : '#000';
    ctx.fillRect(0, 0, w, h);
  }

  if (pattern === 'bars') {
    const colors = ['#fff','#ff0','#0ff','#0f0','#f0f','#f00','#00f','#000'];
    const barWidth = w / colors.length;

    colors.forEach((color, i) => {
      ctx.fillStyle = color;
      ctx.fillRect(i * barWidth, 0, barWidth, h);
    });
  }

  if (pattern === 'checker') {
    const cells = 8;
    const cw = w / cells;
    const ch = h / cells;

    for (let y = 0; y < cells; y++) {
      for (let x = 0; x < cells; x++) {
        ctx.fillStyle = (x + y) % 2 === 0 ? '#000' : '#fff';
        ctx.fillRect(x * cw, y * ch, cw, ch);
      }
    }
  }

  if (pattern === 'countdown') {
    const value = flashActive ? 'GO' : Math.max(1, 3 - Math.floor(frame / 60));
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${h * 0.25}px -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(value, w / 2, h / 2);
  }

  counter.textContent = `Frame ${frame}`;
}

function scheduleAudio() {
  const type = document.getElementById('audio').value;
  const delay = Number(document.getElementById('delay').value) / 1000;
  const level = Number(document.getElementById('level').value) / 100;
  const period = Number(document.getElementById('period').value);
  const now = audioContext.currentTime;

  nextEventTime = now + delay;

  for (let i = 0; i < 20; i++) {
    if (type === 'click') {
      playClick(nextEventTime, level);
    } else if (type === 'beep') {
      playBeep(nextEventTime, level);
    }

    nextEventTime += period;
  }
}

function playClick(time, level) {
  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.type = 'square';
  oscillator.frequency.value = 1000;
  gain.gain.setValueAtTime(level, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.003);

  oscillator.connect(gain).connect(audioContext.destination);
  oscillator.start(time);
  oscillator.stop(time + 0.003);
}

function playBeep(time, level) {
  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.type = 'sine';
  oscillator.frequency.value = 1000;
  gain.gain.setValueAtTime(level, time);
  gain.gain.setValueAtTime(level, time + 0.09);
  gain.gain.linearRampToValueAtTime(0, time + 0.1);

  oscillator.connect(gain).connect(audioContext.destination);
  oscillator.start(time);
  oscillator.stop(time + 0.1);
}

function loop() {
  if (!running) return;

  frame++;

  if (flashFramesLeft > 0) {
    flashFramesLeft--;

    if (flashFramesLeft === 0) {
      const period = Number(document.getElementById('period').value);
      framesUntilFlash = Math.round(period * 60);
    }
  } else {
    framesUntilFlash--;

    if (framesUntilFlash <= 0) {
      flashFramesLeft = Number(document.getElementById('flash').value);
    }
  }

  draw();
  requestAnimationFrame(loop);
}

startButton.addEventListener('click', async () => {
  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  await audioContext.resume();

  running = true;
  frame = 0;
  flashFramesLeft = 0;
  framesUntilFlash = 0;

  scheduleAudio();

  panel.classList.add('hidden');
  startButton.classList.add('hidden');
  stopButton.classList.remove('hidden');

  requestAnimationFrame(loop);
});

stopButton.addEventListener('click', () => {
  running = false;
  audioContext.close();
  panel.classList.remove('hidden');
  startButton.classList.remove('hidden');
  stopButton.classList.add('hidden');
});

document.getElementById('flash').addEventListener('input', event => {
  document.getElementById('flashValue').textContent = event.target.value;
});

document.getElementById('period').addEventListener('input', event => {
  document.getElementById('periodValue').textContent =
    Number(event.target.value).toFixed(1);
});

document.getElementById('delay').addEventListener('input', event => {
  document.getElementById('delayValue').textContent = event.target.value;
});

document.getElementById('level').addEventListener('input', event => {
  document.getElementById('levelValue').textContent = event.target.value;
});
</script>

</body>
</html>
